[pytest]
python_files = pytest_*.py
addopts =
    --embedded-services esp,idf
    --ignore-no-tests-collected-error
    --ignore-glob */managed_components/*
    --ignore=examples/ssl
    --ignore=examples/wss
    --junitxml=junit.xml
    --ignore-result-files .gitlab/ignored_cases.txt
    --root-logdir=test_logs

filterwarnings =
    ignore::FutureWarning

junit_family = xunit1

env_markers =
    eth_cfg_default: Default Ethernet configuration required for test
    eth_cfg_default_stress: Default Ethernet configuration required for stress test
    eth_ip101: ESP32-Ethernet-Kit required; OpenOCD coverage dump
    generic: applicable to generic ESP devices

# log related
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
