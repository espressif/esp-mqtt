# ESP-MQTT Build Test Rules
# Consolidated manifest covering all examples and test apps

.mqtt_core: &mqtt_core
    depends_filepatterns:
        - "mqtt_client.c"
        - "mqtt5_client.c"
        - "include/**"
        - "lib/**"
        - "CMakeLists.txt"
        - "cmake/**"
        - "Kconfig*"
        - "idf_component.yml"

# idf-build-apps appends keys ending in "+"; a second depends_filepatterns would replace the list.
.mqtt_test_apps: &mqtt_test_apps
    <<: *mqtt_core
    depends_filepatterns+:
        - "test/apps/common/**"

.default_rules: &default_rules
    <<: *mqtt_core
    disable:
        - if: IDF_TARGET in ["esp32h21", "esp32h4"]
          temporary: true
          reason: not supported yet
    disable_test:
        - if: IDF_TARGET not in ["esp32"]
          reason: Tests run only on ESP32 with ethernet runners

# Basic TCP MQTT example
examples/tcp:
    <<: *default_rules

# SSL/TLS MQTT example
examples/ssl:
    <<: *default_rules
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: CN verification enabled, tests disabled during server migration

# WebSocket MQTT example
examples/ws:
    <<: *default_rules

# WebSocket Secure MQTT example
examples/wss:
    <<: *default_rules
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: CN verification enabled, tests disabled during server migration

# MQTT 5.0 protocol example
examples/mqtt5:
    <<: *default_rules
    disable:
        - if: IDF_TARGET in ["esp32h21", "esp32h4"]
          temporary: true
          reason: not supported yet
        - if: CONFIG_NAME == "picolibc_no_compat" and IDF_VERSION_MAJOR < 6
          reason: IDF 5.x cannot build with newlib compat disabled

# SSL with mutual authentication
examples/ssl_mutual_auth:
    <<: *default_rules
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: Advanced feature demonstration, only build

# SSL with pre-shared keys
examples/ssl_psk:
    <<: *default_rules
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: Advanced feature demonstration, only build

# SSL with Digital Signature peripheral
examples/ssl_ds:
    <<: *default_rules
    disable:
        - if: SOC_DIG_SIGN_SUPPORTED != 1
          reason: DS not present
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: Advanced feature demonstration, only build

examples/custom_outbox:
    <<: *default_rules
    disable_test:
        - if: IDF_TARGET == IDF_TARGET
          reason: Advanced feature demonstration, only build

test/apps:
    <<: *mqtt_test_apps
    disable:
        - if: IDF_TARGET not in ["esp32"]
          reason: Test apps build only for esp32
    disable_test:
        - if: IDF_TARGET != "esp32"
          temporary: false
          reason: Only esp32 target has ethernet runners for integration tests

# C++ compatibility build test
test/apps/build_test:
    <<: *mqtt_test_apps
    enable:
        - if: IDF_TARGET in ["esp32", "esp32c3"]
          reason: C++ compatibility build test
    disable_test:
        - if: IDF_TARGET != IDF_TARGET
          temporary: false
          reason: Build only test

# Publish/Connect integration test
test/apps/publish_connect_test:
    <<: *mqtt_test_apps
    enable:
        - if: IDF_TARGET in ["esp32"]
          reason: Integration test for publish/connect functionality
    disable_test:
        - if: IDF_TARGET != "esp32"
          temporary: false
          reason: Only esp32 target has ethernet runners for integration tests

# MQTT conformance integration test
test/apps/mqtt_conformance:
    <<: *mqtt_test_apps
    enable:
        - if: IDF_TARGET in ["esp32"] and MQTT_CONFORMANCE_ENABLED == "1"
          reason: Conformance and coverage run on the idf-latest only
    disable:
        - if: MQTT_CONFORMANCE_ENABLED == "0"
          temporary: false
          reason: Conformance is enabled only for pipeline on idf-latest
    disable_test:
        - if: IDF_TARGET != "esp32"
          temporary: false
          reason: Test runs only on esp32 target

# Host tests (unit tests with mocks)
test/host:
    <<: *mqtt_core
    enable:
        - if: IDF_TARGET in ["linux"]
          reason: Host-based unit tests with mocked ESP-IDF components
