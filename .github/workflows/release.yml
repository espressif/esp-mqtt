name: Release and Upload Component

on:
  # For pull requests: validate component upload rules with dry-run.
  pull_request:

  # For pushes to master: run release-please, then upload when a release is created.
  push:
    branches:
      - master

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'master'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload_components_dry_run:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Upload component to the component registry (dry run)
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "mqtt: ."
          namespace: "espressif"
          dry_run: true

  upload_components_release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'master' &&
      needs.release-please.outputs.releases_created == 'true'
    needs: [release-please]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "mqtt: ."
          namespace: "espressif"
          dry_run: ${{ github.repository_owner != 'espressif' }}

  update_mirror_tags:
    runs-on: ubuntu-latest
    # Only run on push to master when release-please actually creates a release
    if: github.event_name == 'push' && github.ref_name == 'master' && needs.release-please.outputs.releases_created == 'true'
    needs: [release-please]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'
      - name: Sync release commit and tags to GitLab
        run: |
          echo "Syncing release commit and tags to GitLab"

          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_URL }}/${{ github.repository }}.git

          git push --atomic gitlab HEAD:master --tags

          echo "Release commit and tags successfully synced to GitLab"

  deploy_docs:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'master' &&
      github.repository_owner == 'espressif'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          pip install "setuptools<81" esp-docs linuxdoc

      - name: Publish documentation
        env:
          RELEASES_CREATED: ${{ needs.release-please.outputs.releases_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          DOCS_BUILD_DIR: ${{ github.workspace }}/docs/_build
          DOCS_DEPLOY_PRIVATEKEY: ${{ secrets.DOCS_PROD_PRIVATEKEY }}
          DOCS_DEPLOY_SERVER: ${{ secrets.DOCS_PROD_SERVER }}
          DOCS_DEPLOY_SERVER_USER: ${{ secrets.DOCS_PROD_SERVER_USER }}
          DOCS_DEPLOY_PATH: ${{ secrets.DOCS_PROD_PATH }}
          DOCS_DEPLOY_URL_BASE: ${{ secrets.DOCS_PROD_URL_BASE }}
          TYPE: production
        run: |
          set -euo pipefail
          git fetch --tags --force
          source "${GITHUB_WORKSPACE}/.gitlab/ci/utils.sh"
          add_doc_server_ssh_keys "$DOCS_DEPLOY_PRIVATEKEY" "$DOCS_DEPLOY_SERVER" "$DOCS_DEPLOY_SERVER_USER"

          build_docs() {
            local ref_name="$1"
            export GITHUB_REF_NAME="$ref_name"
            export GIT_VER="$ref_name"
            unset CI_COMMIT_REF_NAME
            rm -rf "${DOCS_BUILD_DIR}"
            (
              cd "${GITHUB_WORKSPACE}/docs"
              export LC_ALL=C.UTF-8
              build-docs -t esp32 -l en
              build-docs -t esp32 -l zh_CN
            )
          }

          publish() {
            local ref_name="$1"
            local stable="$2"
            build_docs "$ref_name"
            if [ "$stable" = "1" ]; then
              export DEPLOY_STABLE=1
            else
              unset DEPLOY_STABLE
            fi
            deploy-docs
          }

          refresh_published_tags() {
            local versions_js="${GITHUB_WORKSPACE}/docs/_static/mqtt_docs_versions.js"
            local remote_js
            remote_js="$(ssh -o BatchMode=yes "$DOCS_DEPLOY_SERVER" -x mktemp)"
            scp -B "$versions_js" "${DOCS_DEPLOY_SERVER}:${remote_js}"
            ssh -o BatchMode=yes "$DOCS_DEPLOY_SERVER" -x bash -s -- "$DOCS_DEPLOY_PATH" "$remote_js" <<'EOF'
          set -euo pipefail
          docs_path="$1"
          versions_js="$2"
          chmod 664 "$versions_js"
          shopt -s nullglob
          for lang in en zh_CN; do
            for dir in "${docs_path}/${lang}/stable" "${docs_path}/${lang}"/v*; do
              if [ -d "${dir}/esp32/_static" ]; then
                cp "$versions_js" "${dir}/esp32/_static/mqtt_docs_versions.js"
              fi
            done
          done
          rm -f "$versions_js"
          EOF
          }

          if [ "${RELEASES_CREATED}" = "true" ]; then
            tag="${RELEASE_TAG}"
            if [ -z "$tag" ]; then
              tag="$(git describe --tags --exact-match HEAD)"
            fi
            if [ -z "$tag" ]; then
              echo "release-please did not provide a tag" >&2
              exit 1
            fi
            publish "$tag" 1
          fi
          publish master 0
          refresh_published_tags
