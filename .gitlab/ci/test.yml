host_tests:
    image: espressif/idf:release-v6.0
    stage: test
    tags: [build]
    timeout: 1h
    variables:
        GIT_DEPTH: 1
    needs: []
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
        - if: '$CI_MERGE_REQUEST_LABELS =~ /(?:^|,)BUILD_AND_TEST_ALL_APPS(?:,|$)/'
        - changes:
              - mqtt_client.c
              - mqtt5_client.c
              - include/**/*
              - lib/**/*
              - CMakeLists.txt
              - cmake/**/*
              - Kconfig*
              - idf_component.yml
              - test/host/**/*
              - test/mqtt_utils_host_test/**/*
              - test/mqtt_outbox_host_test/**/*
              - test/mqtt_msg_host_test/**/*
              - .gitlab-ci.yml
              - .gitlab/ci/test.yml
              - .idf_ci.toml
              - .idf_build_apps.toml
              - .build-test-rules.yml
    coverage: '/^lines:\s+(\d+\.\d+)\%/'
    artifacts:
        paths:
            - "**/build*/build.log"
            - "**/coverage.xml"
            - "**/coverage.html"
        expire_in: 1 week
        when: always
        reports:
            junit: "**/junit.xml"
            coverage_report:
                coverage_format: cobertura
                path: "**/coverage.xml"
    before_script:
        - CONSTRAINT_FILE="$(ls -1 ${IDF_TOOLS_PATH}/espidf.constraints.v*.txt 2>/dev/null | tail -1)"
        - test -f "${CONSTRAINT_FILE}"
        - pip install -U gcovr 'idf-ci>=1.2.2,<2' -c "${CONSTRAINT_FILE}"
    script: |
        set -euo pipefail
        ORIG_DIR="${CI_PROJECT_DIR:-$(pwd)}"
        cd "${ORIG_DIR}"
        echo "Original dir: $(pwd)"
        rm -rf mqtt
        git worktree add --force mqtt HEAD || (echo "Worktree failed; using local clone" && git clone --local --no-hardlinks . mqtt)
        git worktree list || true
        cd mqtt
        idf-ci build run -t linux -p test
        cd test/host
        ./build_linux_coverage/host_mqtt_client_test.elf -r junit -o junit.xml
        cd ../mqtt_utils_host_test
        ./build_linux_default/mqtt_utils_host_test.elf
        cd ../mqtt_outbox_host_test
        ./build_linux_coverage/mqtt_outbox_host_test.elf
        cd ../mqtt_msg_host_test
        ./build_linux_coverage/mqtt_msg_host_test.elf
        cd ../..
        gcovr --gcov-ignore-parse-errors -k -r . --exclude '.*/managed_components/.*' --print-summary --html coverage.html -x coverage.xml
