generate_prebuild_report:
  stage: pre_check
  image: espressif/idf:latest
  tags: [build]
  artifacts:
    paths:
      - prebuild_report.html
    expire_in: 1 week
    when: always
  script:
    - CONSTRAINT_FILE="$(ls -1 ${IDF_TOOLS_PATH}/espidf.constraints.v*.txt 2>/dev/null | tail -1)"
    - test -f "${CONSTRAINT_FILE}"
    - pip install -U 'idf-ci>=1.3.0,<2' -c "${CONSTRAINT_FILE}"
    - idf-ci build collect --format html -o prebuild_report.html
    - echo "Report generated at ${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/prebuild_report.html"
